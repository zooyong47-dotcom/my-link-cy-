<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- NOL Gradient Background -->
    <linearGradient id="nolAvatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECFF"/>
      <stop offset="50%" stop-color="#F5F6FF"/>
      <stop offset="100%" stop-color="#DFE2FF"/>
    </linearGradient>

    <!-- Clothes Gradient: Deep Modern Navy / NOL Blue Tone -->
    <linearGradient id="clothesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3549FF"/>
      <stop offset="100%" stop-color="#1E2A96"/>
    </linearGradient>

    <!-- Inner Collar Gradient -->
    <linearGradient id="innerShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9EAEF"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3549FF" flood-opacity="0.12"/>
    </filter>
    <filter id="headShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B1C1F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Base with Soft Radius -->
  <rect width="240" height="240" rx="48" fill="url(#nolAvatarBg)"/>
  
  <!-- Subtle Outer Rim -->
  <rect x="1" y="1" width="238" height="238" rx="47" fill="none" stroke="#B2BAFF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="90" r="70" fill="#4154FF" opacity="0.08"/>

  <!-- Character Clothes: Modern Smart Hoodie / Sweatshirt in NOL Blue -->
  <g filter="url(#softShadow)">
    <path d="M34 240 C42 186 72 162 102 158 L138 158 C168 162 198 186 206 240 Z" fill="url(#clothesGrad)"/>
    <!-- Inner T-shirt Collar -->
    <path d="M104 158 C110 172 120 176 136 158" fill="url(#innerShirt)"/>
    <!-- Modern Zipper / Center Seam -->
    <line x1="120" y1="172" x2="120" y2="240" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- Neck -->
  <rect x="107" y="132" width="26" height="30" rx="6" fill="#F8D3B8"/>
  <!-- Neck Shadow -->
  <path d="M107 132 C114 142 126 142 133 132 Z" fill="#E8B896" opacity="0.4"/>

  <!-- Ears -->
  <ellipse cx="68" cy="116" rx="8" ry="11" fill="#F8D3B8"/>
  <ellipse cx="172" cy="116" rx="8" ry="11" fill="#F8D3B8"/>
  <ellipse cx="68" cy="116" rx="4.5" ry="6.5" fill="#EAA982" opacity="0.5"/>
  <ellipse cx="172" cy="116" rx="4.5" ry="6.5" fill="#EAA982" opacity="0.5"/>

  <!-- Face: Clean Natural Skin Tone -->
  <g filter="url(#headShadow)">
    <path d="M74 102 C74 65 94 62 120 62 C146 62 166 65 166 102 C166 138 147 154 120 154 C93 154 74 138 74 102 Z" fill="#FCE1CF"/>
  </g>

  <!-- Cheeks: Subtle Warm Glow -->
  <circle cx="88" cy="122" r="7" fill="#FF8A8A" opacity="0.18"/>
  <circle cx="152" cy="122" r="7" fill="#FF8A8A" opacity="0.18"/>

  <!-- Hair: Modern Clean Styled Dark Hair -->
  <path d="M68 96 C68 54 90 32 120 32 C150 32 172 54 172 96 C172 102 166 100 164 92 C159 66 146 54 120 54 C94 54 81 66 76 92 C74 100 68 102 68 96 Z" fill="#1B1C1F"/>
  <path d="M73 82 C84 66 102 64 116 72 C126 62 144 64 154 74 C162 68 168 76 166 84 C158 74 148 72 138 78 C128 72 112 70 102 78 C92 70 82 72 73 82 Z" fill="#2A2C32"/>

  <!-- Eyebrows: Soft Rounded -->
  <path d="M86 93 Q98 90 106 93" fill="none" stroke="#1B1C1F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M134 93 Q142 90 154 93" fill="none" stroke="#1B1C1F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Modern Smart Round Glasses (Thin Slate Finish) -->
  <rect x="80" y="100" width="32" height="25" rx="8" fill="#FFFFFF" fill-opacity="0.25" stroke="#1B1C1F" stroke-width="2"/>
  <rect x="128" y="100" width="32" height="25" rx="8" fill="#FFFFFF" fill-opacity="0.25" stroke="#1B1C1F" stroke-width="2"/>
  <line x1="112" y1="111" x2="128" y2="111" stroke="#1B1C1F" stroke-width="2"/>
  <!-- Glasses Temple Arms -->
  <line x1="72" y1="108" x2="80" y2="110" stroke="#1B1C1F" stroke-width="1.8"/>
  <line x1="160" y1="110" x2="168" y2="108" stroke="#1B1C1F" stroke-width="1.8"/>

  <!-- Eyes: Friendly Dark Pupils with Light Catch -->
  <ellipse cx="96" cy="112" rx="4" ry="4.5" fill="#1B1C1F"/>
  <circle cx="98" cy="110" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="144" cy="112" rx="4" ry="4.5" fill="#1B1C1F"/>
  <circle cx="146" cy="110" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M118 118 Q120 123 122 121" fill="none" stroke="#E59F78" stroke-width="2" stroke-linecap="round"/>

  <!-- Friendly Smile -->
  <path d="M112 133 Q120 140 128 133" fill="none" stroke="#D47355" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Clean Verified Sparkle Accent in NOL Blue -->
  <g transform="translate(182, 38)">
    <circle cx="12" cy="12" r="14" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="12" cy="12" r="12" fill="#4154FF"/>
    <path d="M12 6 L13.5 10.5 L18 12 L13.5 13.5 L12 18 L10.5 13.5 L6 12 L10.5 10.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
